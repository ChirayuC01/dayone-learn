name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Only needed so `prisma generate` can read the schema; nothing connects during build.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # Azure App Service runtime
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Migrations and seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dayone
          POSTGRES_PASSWORD: dayone
          POSTGRES_DB: dayone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dayone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dayone:dayone@localhost:5432/dayone
      SHADOW_DATABASE_URL: postgresql://dayone:dayone@localhost:5432/shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # the seed script runs TypeScript directly (Node ≥ 22.18)
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Schema and migrations are in sync
        run: |
          PGPASSWORD=dayone psql -h localhost -U dayone -d dayone -c 'CREATE DATABASE shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - name: Seed (twice, to prove it is idempotent)
        run: npm run db:seed && npm run db:seed
